<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolland Auda – Créations musicales</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    @font-face {
      font-family: "PT Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/pt-mono-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122;
    }
    @font-face {
      font-family: "PT Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url("fonts/pt-mono-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+1E00-1E9F, U+1EF2-1EFF, U+2C60-2C7F, U+A720-A7FF;
    }

    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; }
    body { font-family: "PT Mono", "Courier New", monospace; font-size: 15px; line-height: 1.6; }

    /* le fond : illusion de Zöllner. Les longues lignes sont exactement parallèles ;
       ce sont les hachures alternées qui les font paraître convergentes */
    .zebre { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

    main { position: relative; z-index: 1; max-width: 46rem; margin: 0 auto;
           text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 9px #fff;   /* halo blanc : le texte reste lisible sur les hachures */
           padding: clamp(2.5rem, 12vh, 7rem) 1.5rem 4rem; }
    header { border-bottom: 2px solid #111; padding-bottom: 1.1rem; }
    h1 { font-size: clamp(1.5rem, 6vw, 3.3rem); font-weight: normal; letter-spacing: .3em;
         text-transform: uppercase; margin: 0; line-height: 1.15; }
    .sous { margin: .9rem 0 0; letter-spacing: .28em; text-transform: uppercase; color: #333; }

    h2 { font-size: 1em; font-weight: normal; text-transform: uppercase; letter-spacing: .22em;
         margin: 3.2rem 0 .4rem; padding-bottom: .4rem; border-bottom: 1px solid #111; }
    h2 .num { display: inline-block; width: 2.6em; letter-spacing: 0; color: #777; }

    ol { list-style: none; margin: 0; padding: 0; }
    li a { display: flex; align-items: baseline; gap: .8em; padding: .7rem .4rem; margin: 0 -.4rem;
           color: inherit; text-decoration: none; }
    .titre { text-transform: uppercase; letter-spacing: .14em; }
    .points { flex: 1; border-bottom: 1px dotted #999; transform: translateY(-.3em); }
    .duree { color: #777; }
    li a:hover, li a:focus-visible { background: #111; color: #fff; outline: none; text-shadow: none; }
    li a:hover .duree, li a:focus-visible .duree { color: #ccc; }
    li a:hover .points, li a:focus-visible .points { border-color: #777; }

    li.avenir { display: flex; align-items: baseline; gap: .8em; padding: .7rem 0; color: #777; }
  </style>
</head>
