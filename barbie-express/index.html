<!DOCTYPE html>

  <style>

    /* la photo animée se pose exactement sur la photo fixe */
    #onde { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    #onde canvas { display: block; width: 100%; height: 100%; }
  </style>

<body>

    <section class="morceau" id="sueno-tropical">

    </section>
  </main>

  <button type="button" id="b-figer">Figer l'image</button>

  <script src="../lecteurs.js"></script>
